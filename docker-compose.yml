services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: production-flow-api
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,api"
      POSTGRES_DB: production_flow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_CONN_MAX_AGE: 60
      PRICE_SCRAPPER_ENDPOINT: "http://host.docker.internal:8001"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:17-3.5
    container_name: production-flow-db
    environment:
      POSTGRES_DB: production_flow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d production_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
